<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="512" y1="0" x2="512" y2="1024" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#3FB55D"/>
      <stop offset="0.55" stop-color="#1B9431"/>
      <stop offset="1" stop-color="#0E6E22"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1" gradientUnits="objectBoundingBox">
      <stop offset="0" stop-color="white" stop-opacity="0.22"/>
      <stop offset="0.5" stop-color="white" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1024" height="1024" rx="230" fill="url(#bg)"/>
  <rect width="1024" height="512" rx="230" fill="url(#sheen)"/>

  <!-- background ghost ¥ -->
  <text x="512" y="556" text-anchor="middle" dominant-baseline="central"
        font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', system-ui, sans-serif"
        font-size="900" font-weight="900" fill="white" opacity="0.08">¥</text>

  <!-- main ¥ -->
  <text x="512" y="540" text-anchor="middle" dominant-baseline="central"
        font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', system-ui, sans-serif"
        font-size="600" font-weight="800" fill="white" letter-spacing="-10">¥</text>
</svg>
